<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2 Assignment</title>
     <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Sarina Crowder for the WEB-115 course at Wake Tech.</p>
    <script>document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>
    <noscript>The <noscript> is for web browsers with JavaScript rendering disabled.</noscript>
    <div class="container">
    <div class="row">
        <!-- Dashboard Content -->
        <div class ="col" id ="weekly-tasks">

            <form id="task-form" class="mt-3">
                <div class="mb-3">
                    <label for="user-name" class="form-label">Name: </label>
                    <input type="text" id="userName" class="form-control" placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label for="daily-goal" class="form-label">Daily Task Goal: </label>
                    <input type="number" id="dailyGoal" class="form-control" placeholder="daily target">
                </div>

                <div class="mb-3">
                    <label for="weekly-bonus" class="form-label">Weekly Bonus Tasks: </label>
                    <input type="number" id="bonusTasks" class="form-control" placeholder="additional tasks">
                </div>

                <button id="goal-btn" type="submit" class="btn btn-success">Set My Goals</button>

            </form>

            <p id="goal-message" class="mt-3"></p>

            <script src ="js/task-manager.js"></script>
        </div>
    </div>
</div>
</body>
</html>
